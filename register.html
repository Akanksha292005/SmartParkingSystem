{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="container-narrow">
  <div class="card auth-card">
    <span class="eyebrow">Join SmartPark</span>
    <h2 style="font-size:1.6rem;">Create your account</h2>

    <form method="POST" action="{{ url_for('register') }}" style="margin-top:24px;">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input class="form-control" type="text" id="name" name="name" required placeholder="e.g. Rahul Sharma">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input class="form-control" type="tel" id="phone" name="phone" placeholder="98765 43210">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required minlength="4" placeholder="Choose a password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
